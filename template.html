<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Import Dependencies</title>
    <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/dagre/dist/dagre.min.js"></script>
    <script src="https://unpkg.com/cytoscape-dagre/cytoscape-dagre.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #container { display: flex; height: 100vh; }
        #sidebar {
            width: 280px;
            padding: 15px;
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            overflow-y: auto;
        }
        #graph { flex: 1; overflow: hidden; }
        h3 { margin-bottom: 10px; color: #333; font-size: 14px; }
        #search, #layout-select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }
        .filter-section { margin-bottom: 20px; }
        .package-filter {
            display: flex;
            align-items: center;
            padding: 4px 0;
            font-size: 13px;
        }
        .package-filter input { margin-right: 8px; }
        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        #info {
            background: white;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 12px;
        }
        #info h4 { margin-bottom: 8px; color: #2c3e50; }
        #info ul { margin-left: 18px; margin-top: 5px; }
        #info li { margin: 3px 0; }
        .info-section { margin-top: 10px; }
        .legend { margin-top: 20px; font-size: 12px; }
        .legend-item { display: flex; align-items: center; margin: 5px 0; }
        #reset-btn {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        #reset-btn:hover { background: #2980b9; }
        .interaction-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .interaction-row label {
            width: 50px;
            font-size: 13px;
        }
        .interaction-row select {
            flex: 1;
            padding: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
        }
        #removed-nodes {
            max-height: 120px;
            overflow-y: auto;
        }
        .removed-node {
            display: flex;
            align-items: center;
            padding: 3px 0;
            font-size: 12px;
            cursor: pointer;
        }
        .removed-node:hover {
            background: #e8e8e8;
        }
        .removed-node .restore-btn {
            margin-right: 6px;
            color: #27ae60;
            font-weight: bold;
        }
        #removed-count {
            font-size: 11px;
            color: #666;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <div class="filter-section">
                <h3>Layout</h3>
                <select id="layout-select">
                    <option value="dagre-lr">Hierarchical (LR)</option>
                    <option value="dagre-tb">Hierarchical (TB)</option>
                    <option value="cose">Force-directed</option>
                </select>
            </div>
            <h3>Search</h3>
            <input type="text" id="search" placeholder="Filter modules...">
            <div class="filter-section">
                <h3>Packages</h3>
                <div id="package-filters"></div>
            </div>
            <button id="reset-btn">Reset View</button>
            <div class="filter-section">
                <h3>Removed Nodes <span id="removed-count"></span></h3>
                <div id="removed-nodes"></div>
                <button id="restore-all-btn" style="display:none;margin-top:8px;padding:4px 8px;font-size:11px;">Restore All</button>
            </div>
            <div id="info">
                <h4>Module Info</h4>
                <p>Click a node to see details</p>
            </div>
            <div class="legend">
                <h3>Legend</h3>
                <div class="legend-item">
                    <svg width="30" height="12"><line x1="0" y1="6" x2="25" y2="6" stroke="#999" stroke-width="1.5"></line><polygon points="25,3 30,6 25,9" fill="#999"></polygon></svg>
                    <span style="margin-left:8px">Import</span>
                </div>
                <div class="legend-item">
                    <svg width="30" height="12"><line x1="0" y1="6" x2="25" y2="6" stroke="#e74c3c" stroke-width="2.5"></line><polygon points="25,3 30,6 25,9" fill="#e74c3c"></polygon></svg>
                    <span style="margin-left:8px">Circular dependency</span>
                </div>
            </div>
            <div class="filter-section">
                <h3>Interactions</h3>
                <div class="interaction-row">
                    <label>Hover:</label>
                    <select id="hover-action">
                        <option value="highlight">Highlight</option>
                        <option value="focus">Focus</option>
                        <option value="none">None</option>
                    </select>
                </div>
                <div class="interaction-row">
                    <label>Click:</label>
                    <select id="click-action">
                        <option value="focus">Focus</option>
                        <option value="highlight">Highlight</option>
                        <option value="none">None</option>
                    </select>
                </div>
            </div>
        </div>
        <div id="graph"></div>
    </div>
    <script>
    const data = /*GRAPH_DATA*/null;

    // Removed nodes (persisted in sessionStorage)
    const STORAGE_KEY = 'deps-viz-removed-nodes';
    let removedNodeIds = new Set(JSON.parse(sessionStorage.getItem(STORAGE_KEY) || '[]'));

    function saveRemovedNodes() {
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify([...removedNodeIds]));
    }

    function removeNode(nodeId) {
        removedNodeIds.add(nodeId);
        saveRemovedNodes();
        renderRemovedNodes();
        // Clear selection if removing selected node
        if (selectedNodeId === nodeId) selectedNodeId = null;
        if (softSelectedNodeId === nodeId) softSelectedNodeId = null;
        if (focusedNodeId === nodeId) focusedNodeId = null;
        updateVisibility();
    }

    function restoreNode(nodeId) {
        removedNodeIds.delete(nodeId);
        saveRemovedNodes();
        renderRemovedNodes();
        updateVisibility();
    }

    function renderRemovedNodes() {
        const container = document.getElementById('removed-nodes');
        const countEl = document.getElementById('removed-count');
        const restoreAllBtn = document.getElementById('restore-all-btn');

        countEl.textContent = removedNodeIds.size ? `(${removedNodeIds.size})` : '';
        restoreAllBtn.style.display = removedNodeIds.size > 1 ? 'inline-block' : 'none';

        if (removedNodeIds.size === 0) {
            container.innerHTML = '<div style="font-size:11px;color:#888;">Shift+click to remove</div>';
            return;
        }

        container.innerHTML = [...removedNodeIds].sort().map(id => `
            <div class="removed-node" data-node="${id}">
                <span class="restore-btn">+</span>
                <span>${id}</span>
            </div>
        `).join('');
    }

    function restoreAllNodes() {
        removedNodeIds.clear();
        saveRemovedNodes();
        renderRemovedNodes();
        updateVisibility();
    }

    document.getElementById('removed-nodes').addEventListener('click', (e) => {
        const item = e.target.closest('.removed-node');
        if (item) restoreNode(item.dataset.node);
    });

    document.getElementById('restore-all-btn').addEventListener('click', restoreAllNodes);

    // Color palette for packages (lighter, more readable with dark text)
    const colorPalette = [
        '#7cb5ec', '#f7a35c', '#90ed7d', '#8085e9', '#f15c80',
        '#e4d354', '#2b908f', '#f45b5b', '#91e8e1', '#c4a4e0'
    ];
    const packages = [...new Set(data.nodes.map(n => n.package))].sort();
    const packageColors = {};
    packages.forEach((pkg, i) => {
        packageColors[pkg] = colorPalette[i % colorPalette.length];
    });

    // Create cycle edge lookup
    const cycleSet = new Set(data.cycles.map(c => c[0] + '|' + c[1]));

    // Build Cytoscape elements
    function buildElements(nodeFilter) {
        const visibleNodeIds = nodeFilter ? nodeFilter : new Set(data.nodes.map(n => n.id));

        const nodes = data.nodes
            .filter(n => visibleNodeIds.has(n.id) && !removedNodeIds.has(n.id))
            .map(n => ({
                data: {
                    id: n.id,
                    label: n.id.split('.').pop(),
                    package: n.package
                }
            }));

        const edges = data.links
            .filter(l => visibleNodeIds.has(l.source) && visibleNodeIds.has(l.target)
                      && !removedNodeIds.has(l.source) && !removedNodeIds.has(l.target))
            .map(l => ({
                data: {
                    id: l.source + '->' + l.target,
                    source: l.source,
                    target: l.target,
                    isCycle: cycleSet.has(l.source + '|' + l.target)
                },
                classes: cycleSet.has(l.source + '|' + l.target) ? 'cycle' : ''
            }));

        return { nodes, edges };
    }

    // Cytoscape style
    const cyStyle = [
        {
            selector: 'node',
            style: {
                'label': 'data(label)',
                'text-valign': 'center',
                'text-halign': 'center',
                'background-color': node => packageColors[node.data('package')] || '#999',
                'border-width': 1,
                'border-color': '#333',
                'shape': 'roundrectangle',
                'width': node => Math.max(60, node.data('label').length * 8 + 16),
                'height': 28,
                'font-size': 11,
                'color': '#000',
                'transition-property': 'border-width, border-color, opacity, shadow-blur, shadow-opacity',
                'transition-duration': '0.2s'
            }
        },
        {
            selector: 'node.matched',
            style: {
                'border-width': 3,
                'border-color': '#000'
            }
        },
        {
            selector: 'node.neighbor',
            style: {
                'opacity': 0.6
            }
        },
        {
            selector: 'node.selected',
            style: {
                'border-width': 4,
                'border-color': '#e74c3c',
                'shadow-blur': 15,
                'shadow-color': '#e74c3c',
                'shadow-opacity': 0.8,
                'shadow-offset-x': 0,
                'shadow-offset-y': 0
            }
        },
        {
            selector: 'node.soft-selected',
            style: {
                'border-width': 3,
                'border-color': '#e74c3c',
                'border-style': 'dashed'
            }
        },
        {
            selector: 'node.highlight-dim',
            style: {
                'opacity': 0.3
            }
        },
        {
            selector: 'edge',
            style: {
                'width': 1.5,
                'line-color': '#999',
                'target-arrow-color': '#999',
                'target-arrow-shape': 'triangle',
                'curve-style': 'bezier',
                'arrow-scale': 0.8,
                'transition-property': 'opacity',
                'transition-duration': '0.2s'
            }
        },
        {
            selector: 'edge.cycle',
            style: {
                'width': 2.5,
                'line-color': '#e74c3c',
                'target-arrow-color': '#e74c3c'
            }
        },
        {
            selector: 'edge.highlight-dim',
            style: {
                'opacity': 0.3
            }
        }
    ];

    // Initialize Cytoscape
    let cy = cytoscape({
        container: document.getElementById('graph'),
        elements: buildElements(),
        style: cyStyle,
        layout: { name: 'dagre', rankDir: 'LR', nodeSep: 30, rankSep: 80 }
    });

    // Track state
    let matchedNodeIds = new Set();
    let neighborNodeIds = new Set();
    let focusedNodeId = null;

    // Layout functions
    function runLayout(name, centerNodeId) {
        let layoutConfig;
        if (name === 'dagre-lr') {
            layoutConfig = { name: 'dagre', rankDir: 'LR', nodeSep: 30, rankSep: 80, animate: true, animationDuration: 300 };
        } else if (name === 'dagre-tb') {
            layoutConfig = { name: 'dagre', rankDir: 'TB', nodeSep: 30, rankSep: 80, animate: true, animationDuration: 300 };
        } else {
            layoutConfig = { name: 'cose', animate: true, animationDuration: 300, nodeRepulsion: 8000, idealEdgeLength: 100 };
        }

        const layout = cy.layout(layoutConfig);
        layout.on('layoutstop', () => {
            // Center on: explicit node > soft-selected > fit all
            const targetNodeId = centerNodeId || softSelectedNodeId;
            if (targetNodeId) {
                const node = cy.getElementById(targetNodeId);
                if (node.length) {
                    cy.animate({
                        center: { eles: node },
                        zoom: Math.min(cy.zoom(), 1.5),
                        duration: 300,
                        easing: 'ease-out'
                    });
                    return;
                }
            }
            cy.animate({
                fit: { eles: cy.elements(), padding: 30 },
                duration: 300,
                easing: 'ease-out'
            });
        });
        layout.run();
    }

    // Layout selector
    document.getElementById('layout-select').addEventListener('change', function() {
        runLayout(this.value);
    });

    // Helper: get node connections
    function getConnections(nodeId) {
        const imports = data.links.filter(l => l.source === nodeId).map(l => l.target);
        const importedBy = data.links.filter(l => l.target === nodeId).map(l => l.source);
        const connected = new Set([nodeId, ...imports, ...importedBy]);
        return { imports, importedBy, connected };
    }

    // Helper: update info panel
    function updateInfoPanel(nodeId) {
        const node = cy.getElementById(nodeId);
        const pkg = node.data('package') || '(root)';
        const { imports, importedBy } = getConnections(nodeId);
        document.getElementById('info').innerHTML = `
            <h4>${nodeId}</h4>
            <div class="info-section">
                <strong>Package:</strong> ${pkg}
            </div>
            <div class="info-section">
                <strong>Imports (${imports.length}):</strong>
                <ul>${imports.map(i => '<li>' + i + '</li>').join('') || '<li>None</li>'}</ul>
            </div>
            <div class="info-section">
                <strong>Imported by (${importedBy.length}):</strong>
                <ul>${importedBy.map(i => '<li>' + i + '</li>').join('') || '<li>None</li>'}</ul>
            </div>
        `;
    }

    // Track click-selected node (not hover)
    let selectedNodeId = null;
    let softSelectedNodeId = null;

    // Set visual selection on a single node
    function setVisualSelection(nodeId) {
        cy.nodes().removeClass('selected');
        if (nodeId) {
            const node = cy.getElementById(nodeId);
            if (node.length) node.addClass('selected');
        }
    }

    // Set soft selection (dashed border, visible in full graph)
    function setSoftSelection(nodeId, centerOn) {
        cy.nodes().removeClass('soft-selected');
        softSelectedNodeId = nodeId;
        if (nodeId) {
            const node = cy.getElementById(nodeId);
            if (node.length) {
                node.addClass('soft-selected');
                if (centerOn) {
                    cy.animate({
                        center: { eles: node },
                        duration: 300,
                        easing: 'ease-out'
                    });
                }
            }
        }
    }

    // Clear soft selection
    function clearSoftSelection() {
        cy.nodes().removeClass('soft-selected');
        softSelectedNodeId = null;
    }

    // Apply highlight effect (dim unconnected nodes)
    function applyHighlight(nodeId, isClick) {
        if (isClick) selectedNodeId = nodeId;
        const { connected } = getConnections(nodeId);

        cy.nodes().removeClass('highlight-dim');
        cy.edges().removeClass('highlight-dim');

        cy.nodes().forEach(n => {
            if (!connected.has(n.id())) n.addClass('highlight-dim');
        });
        cy.edges().forEach(e => {
            if (e.source().id() !== nodeId && e.target().id() !== nodeId) e.addClass('highlight-dim');
        });

        setVisualSelection(nodeId);
    }

    // Clear highlight effects
    function clearHighlight() {
        selectedNodeId = null;
        cy.nodes().removeClass('highlight-dim');
        cy.edges().removeClass('highlight-dim');
        setVisualSelection(null);
    }

    // Apply focus effect (rebuild graph with only connected nodes)
    function applyFocus(nodeId) {
        selectedNodeId = nodeId;
        focusedNodeId = nodeId;
        const { connected } = getConnections(nodeId);

        const elements = buildElements(connected);
        cy.json({ elements });
        setVisualSelection(nodeId);
        runLayout(document.getElementById('layout-select').value, nodeId);
    }

    // Clear focus (restore full graph)
    function clearFocus() {
        if (!focusedNodeId) return;
        focusedNodeId = null;
        selectedNodeId = null;
        updateVisibility();
    }

    // Reset all
    function resetAll() {
        focusedNodeId = null;
        selectedNodeId = null;
        cy.nodes().removeClass('highlight-dim selected');
        cy.edges().removeClass('highlight-dim');
        document.getElementById('info').innerHTML = '<h4>Module Info</h4><p>Click a node to see details</p>';
    }

    // Hover events
    cy.on('mouseover', 'node', function(evt) {
        const action = document.getElementById('hover-action').value;
        if (action === 'none') return;
        if (focusedNodeId) return; // don't override focus
        if (selectedNodeId) return; // don't override click selection

        const nodeId = evt.target.id();
        if (action === 'highlight') {
            applyHighlight(nodeId, false);
        } else if (action === 'focus') {
            applyFocus(nodeId);
        }
        updateInfoPanel(nodeId);
    });

    cy.on('mouseout', 'node', function(evt) {
        const action = document.getElementById('hover-action').value;
        if (action === 'none') return;
        if (focusedNodeId) return; // don't clear focus
        if (selectedNodeId) return; // don't clear click selection

        if (action === 'highlight') {
            cy.nodes().removeClass('highlight-dim selected');
            cy.edges().removeClass('highlight-dim');
        } else if (action === 'focus') {
            clearFocus();
        }
        document.getElementById('info').innerHTML = '<h4>Module Info</h4><p>Click a node to see details</p>';
    });

    // Click events
    cy.on('tap', 'node', function(evt) {
        const nodeId = evt.target.id();

        // Shift+click to remove node
        if (evt.originalEvent.shiftKey) {
            removeNode(nodeId);
            return;
        }

        const action = document.getElementById('click-action').value;
        if (action === 'none') return;

        // Toggle: clicking selected node deselects it but keeps soft-selected
        if (selectedNodeId === nodeId) {
            // Set soft-selected BEFORE clearing so runLayout can center on it
            softSelectedNodeId = nodeId;
            if (action === 'focus') {
                clearFocus();
            } else {
                clearHighlight();
            }
            // Apply visual soft-selected class (centering handled by runLayout)
            setSoftSelection(nodeId, false);
            return;
        }

        // Clicking a new node clears soft selection
        clearSoftSelection();

        if (action === 'highlight') {
            focusedNodeId = nodeId; // lock highlight
            applyHighlight(nodeId, true);
        } else if (action === 'focus') {
            applyFocus(nodeId);
        }
        updateInfoPanel(nodeId);
    });

    // Click background to reset
    cy.on('tap', function(evt) {
        if (evt.target === cy) {
            clearSoftSelection();
            if (focusedNodeId) {
                clearFocus();
            }
            document.getElementById('info').innerHTML = '<h4>Module Info</h4><p>Click a node to see details</p>';
        }
    });

    document.getElementById('reset-btn').onclick = () => {
        focusedNodeId = null;
        selectedNodeId = null;
        softSelectedNodeId = null;
        cy.nodes().removeClass('highlight-dim selected soft-selected');
        cy.edges().removeClass('highlight-dim');
        document.getElementById('search').value = '';
        document.querySelectorAll('#package-filters input').forEach(cb => cb.checked = true);
        updateVisibility();
        document.getElementById('info').innerHTML = '<h4>Module Info</h4><p>Click a node to see details</p>';
    };

    // Package filters
    const filtersDiv = document.getElementById('package-filters');
    packages.forEach(pkg => {
        const label = document.createElement('label');
        label.className = 'package-filter';
        label.innerHTML = `
            <input type="checkbox" checked data-package="${pkg}">
            <span class="color-dot" style="background:${packageColors[pkg]}"></span>
            ${pkg || '(root)'}
        `;
        filtersDiv.appendChild(label);
    });

    filtersDiv.addEventListener('change', updateVisibility);
    document.getElementById('search').addEventListener('input', updateVisibility);

    function updateVisibility() {
        const searchTerm = document.getElementById('search').value.toLowerCase();
        const checkedPackages = new Set(
            [...document.querySelectorAll('#package-filters input:checked')].map(cb => cb.dataset.package)
        );

        // Find directly matched nodes
        matchedNodeIds = new Set();
        data.nodes.forEach(n => {
            const matchesSearch = searchTerm === '' || n.id.toLowerCase().includes(searchTerm);
            const matchesPackage = checkedPackages.has(n.package);
            if (matchesSearch && matchesPackage) {
                matchedNodeIds.add(n.id);
            }
        });

        // Find neighbors of matched nodes
        neighborNodeIds = new Set();
        if (searchTerm !== '') {
            data.links.forEach(l => {
                if (matchedNodeIds.has(l.source) && !matchedNodeIds.has(l.target)) {
                    neighborNodeIds.add(l.target);
                }
                if (matchedNodeIds.has(l.target) && !matchedNodeIds.has(l.source)) {
                    neighborNodeIds.add(l.source);
                }
            });
        }

        // Combine matched and neighbor nodes
        const visibleNodeIds = new Set([...matchedNodeIds, ...neighborNodeIds]);

        // Rebuild graph with visible nodes
        const elements = buildElements(visibleNodeIds);
        cy.json({ elements });

        // Apply matched/neighbor styling (clear selected since graph was rebuilt)
        cy.nodes().forEach(n => {
            n.removeClass('matched neighbor selected highlight-dim soft-selected');
            if (matchedNodeIds.has(n.id())) {
                n.addClass('matched');
            } else if (neighborNodeIds.has(n.id())) {
                n.addClass('neighbor');
            }
        });
        cy.edges().removeClass('highlight-dim');

        // Re-apply soft-selected if node is still visible
        if (softSelectedNodeId) {
            const node = cy.getElementById(softSelectedNodeId);
            if (node.length) node.addClass('soft-selected');
        }

        // Run layout
        runLayout(document.getElementById('layout-select').value);
    }

    // Initialize removed nodes panel and apply filter
    renderRemovedNodes();
    if (removedNodeIds.size > 0) {
        updateVisibility();
    }
    </script>
</body>
</html>
