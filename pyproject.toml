[project]
name = "deps-viz"
version = "0.1.0"
description = "Interactive HTML visualization for Python import dependencies"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "import-deps>=0.5",
]

[dependency-groups]
dev = [
    "playwright",
    "rut>=0.4.0",
]

[project.scripts]
deps-viz = "deps_viz:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rut]
source_dirs = ["deps_viz", "tests"]
